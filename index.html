<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <!-- ИСПРАВЛЕНИЕ: Блокируем нативное масштабирование страницы браузером -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TalesStich</title>
    <style>
        html, body {
            margin: 0;
            border: 0;
            overflow: hidden;
            background-color: #000;
            width: 100%;
            height: 100%;
            /* ИСПРАВЛЕНИЕ: Отключаем стандартные жесты скролла и зума на уровне CSS */
            touch-action: none; 
            -webkit-text-size-adjust: none;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // ИСПРАВЛЕНИЕ: Принудительно глушим нативный Pinch-to-zoom в Safari и Chrome
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault(); // Запрещаем браузеру увеличивать страницу
            }
        }, { passive: false });

        document.addEventListener('touchmove', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Запрещаем десктопный зум страницы через Ctrl + Колесо мыши
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
    
    <!-- Стандартная загрузка движка Godot -->
    <script src="index.js"></script>
    <script>
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":75210268,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        engine.startGame();
    </script>
</body>
</html>
